# muse-discord settings.
#
# Copy this file to config.yaml. Setup fills in the first three
# settings; everything else already has a careful default, so change
# only what you want different. Saved edits apply without a restart.
#
#   Check your edits:          python3 bin/settings.py validate
#   What does the bot do here: python3 bin/settings.py show --explain
#
# Servers, channels, people and roles are Discord ids, in quotes. To
# copy one, turn on Developer Mode in Discord (Settings > Advanced),
# then right-click the server, channel or person and pick Copy ID.

version: 1                # VERIFY: confirm the loader expects this key

# --- Set during setup ---------------------------------------------
owners: []                # your Discord user id, in quotes:
                          #   owners: ["123456789012345678"]
persona: persona.md       # the file that gives the bot its personality
token_from: ~/.config/muse-discord/bot_token
                          # where the bot's token is kept: a file, or
                          # env:NAME for an environment variable. Never
                          # put the token itself in this file.

# --- The bot itself -----------------------------------------------
presence:
  status: ""              # a line shown under the bot's name; "" = none
updates:
  notify: on              # DM you when a new version is out: on or off

# --- Everywhere: DMs and every server, unless set more narrowly ----
everywhere:
  who:
    allow: everyone       # everyone, or a list of user ids and
                          # roles: ["<user id>", "role:<role id>"]
    ignore: []            # people or roles it never answers (wins
                          # over allow)
    bots: when-addressed  # other bots and Muses: when-addressed or ignore
    bot_exchange_limit: none
                          # most replies in a row to bots in one channel
                          # before a person speaks: 1-50, or none
  style:
    length: normal        # brief, normal, or detailed
    notes: ""             # house rules for your Muse, such as
                          # "No swearing." (up to 500 characters)
  abilities:
    owner_commands: on    # owners may ask it to pin, post, react,
                          # or start threads: on or off
  privacy:
    memory: public-only   # how much of what your Muse knows about you a
                          # reply may use: everything, public-only, or
                          # nothing. public-only = your name, interests,
                          # public projects and opinions; never your job,
                          # location, money, health, relationships or
                          # schedule. Your own DMs always use everything.
    never_share: []       # words or phrases; a reply containing one is
                          # held until an owner says Send or Discard
    suspicious: hold-for-review
                          # likely prompt-injection: hold-for-review (you
                          # decide) or ignore (dropped)
  limits:
    per_day: none         # replies per day: a number, or none. Each
                          # server counts on its own; DMs count
                          # together.
    per_person_per_day: none
                          # replies per day to any one person. Owners are
                          # never limited.
  plugins:
    media:                # images and video, if your Muse can make
                          # them. VERIFY: plugin id media, off by default
      enabled: off
      who: owners         # owners, everyone, or a list like allow
      per_day: none       # generated replies per day: a number, or none

# --- Direct messages ----------------------------------------------
dms:
  who:
    dms_from: owners      # whose DMs it answers: owners, shared-servers
                          # (people in a server with the bot), or anyone
    replies: conversational
                          # off = never answer DMs. Every DM counts as
                          # addressed, so the other values act the same.

# --- All servers, including ones it joins later -------------------
all_servers:
  who:
    replies: conversational
                          # when-addressed: answers an @mention or a
                          #   reply to the bot.
                          # conversational: also answers the person it
                          #   just replied to when they keep talking
                          #   within ~2 minutes without @mentioning it.
                          # off: stays quiet.
  plugins:
    welcome:
      enabled: off        # greet new members; turn it on per server

# --- One server at a time (example: remove the # marks to use) ----
# servers:
#   "200000000000000001":         # the server's id
#     name: Muse Lounge           # a label for you; the bot ignores it
#     style:
#       notes: "Friendly community. Playful is fine."
#     limits:
#       per_day: 200
#     plugins:
#       welcome:
#         enabled: on
#         channel: "300000000000000001"   # or system: the server's
#                                         # system channel
#         notes: "Point newcomers to #rules."
#     channels:                   # a channel or a whole category
#       "300000000000000002":
#         name: "#announcements"
#         replies: off
#       "300000000000000003":     # a category: its channels follow it
#         name: "Staff"
#         replies: off
#       "300000000000000004":
#         name: "#muse-chat"
#         notes: "Longer answers are welcome here."

# Advanced engine settings (polling, timing, the reply size ceiling)
# are listed in PROTOCOL.md under "Engine settings". Most installs
# never need them.
