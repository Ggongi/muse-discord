<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings Preview</title>
<style>
/* Discord's classic dark and light palettes (approximate). */
:root, body[data-theme="dark"] {
  --bg-primary: #313338; --bg-secondary: #2b2d31; --bg-secondary-alt: #232428;
  --bg-tertiary: #1e1f22; --bg-floating: #111214; --bg-mod-hover: rgba(78,80,88,.3);
  --bg-mod-active: rgba(78,80,88,.48); --bg-message-hover: rgba(2,2,2,.06);
  --text-normal: #dbdee1; --header-primary: #f2f3f5; --header-secondary: #b5bac1;
  --text-muted: #949ba4; --interactive: #b5bac1; --interactive-hover: #dbdee1;
  --link: #00a8fc; --mention-bg: rgba(88,101,242,.3); --mention-fg: #c9cdfb;
  --mention-hover: #5865f2;
  --code-bg: #2b2d31; --code-border: #1e1f22; --code-in-container: #1e1f22;
  --container-bg: #2b2d31; --container-border: rgba(78,80,88,.32);
  --divider: #3f4147; --input-bg: #1e1f22; --select-border: #1e1f22;
  --dropdown-bg: #2b2d31; --dropdown-hover: #35373c; --dropdown-selected: #404249;
  --quote-bar: #4e5058; --spoiler: #1e1f22;
  --btn-secondary: #4e5058; --btn-secondary-hover: #6d6f78; --btn-secondary-fg: #fff;
  --modal-bg: #313338; --modal-footer: #2b2d31; --backdrop: rgba(0,0,0,.7);
  --elev: 0 8px 16px rgba(0,0,0,.24); --red: #f23f43; --green: #23a55a; --amber: #f0b232;
  --tool-bg: #1a1b1e; --tool-panel: #232428; --tool-border: #3f4147;
  --scroll-thumb: #1a1b1e;
}
body[data-theme="light"] {
  --bg-primary: #ffffff; --bg-secondary: #f2f3f5; --bg-secondary-alt: #ebedef;
  --bg-tertiary: #e3e5e8; --bg-floating: #ffffff; --bg-mod-hover: rgba(116,124,138,.14);
  --bg-mod-active: rgba(116,124,138,.24); --bg-message-hover: rgba(6,6,7,.02);
  --text-normal: #313338; --header-primary: #060607; --header-secondary: #4e5058;
  --text-muted: #5c5e66; --interactive: #4e5058; --interactive-hover: #313338;
  --link: #006ce7; --mention-bg: rgba(88,101,242,.15); --mention-fg: #505cdc;
  --mention-hover: #5865f2;
  --code-bg: #f2f3f5; --code-border: #e3e5e8; --code-in-container: #e3e5e8;
  --container-bg: #f2f3f5; --container-border: rgba(116,124,138,.22);
  --divider: #d4d7dc; --input-bg: #ebedef; --select-border: #e3e5e8;
  --dropdown-bg: #ffffff; --dropdown-hover: #f2f3f5; --dropdown-selected: #e3e5e8;
  --quote-bar: #c4c9ce; --spoiler: #c4c9ce;
  --btn-secondary: #6d6f78; --btn-secondary-hover: #4e5058; --btn-secondary-fg: #fff;
  --modal-bg: #ffffff; --modal-footer: #f2f3f5; --backdrop: rgba(0,0,0,.6);
  --elev: 0 8px 16px rgba(0,0,0,.12); --red: #da373c; --green: #1a8a4c; --amber: #c27c0e;
  --tool-bg: #e9eaed; --tool-panel: #f7f8f9; --tool-border: #d4d7dc;
  --scroll-thumb: #c4c9ce;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--tool-bg); color: var(--text-normal);
  font: 16px/1.375 "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------------------------------------------------------------- tool chrome */
#app { display: grid; grid-template-columns: minmax(0,1fr) 400px; grid-template-rows: 44px minmax(0,1fr); height: 100vh; }
#topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 12px;
  background: var(--tool-panel); border-bottom: 1px solid var(--tool-border); font-size: 14px; min-width: 0; overflow-x: auto; }
#topbar .title { font-weight: 700; color: var(--header-primary); white-space: nowrap; margin-right: 6px; }
#topbar .grow { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--tool-border); border-radius: 6px; overflow: hidden; flex: none; }
.seg button { background: transparent; border: 0; padding: 4px 10px; cursor: pointer; color: var(--interactive); font-size: 13px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--tool-border); }
.seg button.on { background: #5865f2; color: #fff; }
.tbtn { background: var(--bg-mod-hover); border: 1px solid var(--tool-border); border-radius: 6px; padding: 4px 10px;
  cursor: pointer; font-size: 13px; color: var(--text-normal); white-space: nowrap; flex: none; }
.tbtn:hover { background: var(--bg-mod-active); }
.tbtn.primary { background: #5865f2; border-color: #5865f2; color: #fff; }
label.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; white-space: nowrap; cursor: pointer; }
#stage { min-width: 0; min-height: 0; display: flex; align-items: stretch; justify-content: center; padding: 12px; overflow: auto; }
#inspector { min-height: 0; overflow-y: auto; background: var(--tool-panel); border-left: 1px solid var(--tool-border); padding: 12px 14px 40px; font-size: 13px; }
#inspector h3 { margin: 16px 0 6px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); }
#inspector h3:first-child { margin-top: 0; }
#inspector select { width: 100%; background: var(--input-bg); border: 1px solid var(--tool-border); border-radius: 6px; padding: 5px 6px; font-size: 13px; }
.row2 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.meter { margin: 6px 0; }
.meter .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--header-secondary); }
.meter .bar { height: 6px; border-radius: 3px; background: var(--bg-mod-active); overflow: hidden; margin-top: 3px; }
.meter .bar i { display: block; height: 100%; background: var(--green); }
.meter.warn .bar i { background: var(--amber); } .meter.over .bar i { background: var(--red); }
.meter.over .lbl b { color: var(--red); }
ul.issues { margin: 4px 0; padding-left: 18px; color: var(--red); }
ul.issues li { margin: 2px 0; word-break: break-word; }
.ok { color: var(--green); }
.muted { color: var(--text-muted); }
pre.json, pre.trace { background: var(--bg-tertiary); border-radius: 6px; padding: 8px; font: 11.5px/1.45 ui-monospace, "SF Mono", Consolas, monospace;
  white-space: pre-wrap; word-break: break-all; max-height: 420px; overflow: auto; margin: 6px 0; }
pre.trace { color: var(--red); }
details > summary { cursor: pointer; color: var(--header-secondary); font-weight: 600; margin: 4px 0; }
ol.steps { margin: 4px 0; padding-left: 22px; }
ol.steps li { margin: 2px 0; word-break: break-word; }
ol.steps li.fail { color: var(--red); }
.banner-err { background: rgba(242,63,67,.12); border: 1px solid var(--red); border-radius: 6px; padding: 8px; margin-bottom: 10px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.kv span:nth-child(odd) { color: var(--text-muted); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--bg-floating); color: var(--text-normal);
  border: 1px solid var(--tool-border); border-radius: 8px; padding: 8px 14px; font-size: 14px; box-shadow: var(--elev); z-index: 100;
  opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; }
#toast.show { opacity: 1; }
@media (max-width: 1000px) {
  body { overflow: auto; }
  #app { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; }
  #stage { height: 86vh; }
  #inspector { border-left: 0; border-top: 1px solid var(--tool-border); }
}

/* ---------------------------------------------------------------- the client */
#frame { position: relative; display: flex; width: 100%; height: 100%; background: var(--bg-primary); border-radius: 8px;
  overflow: hidden; box-shadow: var(--elev); container-type: inline-size; min-height: 0; }
#frame.mobile { width: 390px; flex: none; height: min(844px, calc(100vh - 68px)); border-radius: 28px; border: 8px solid #000; }
#rail { width: 72px; flex: none; background: var(--bg-tertiary); padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; overflow-y: auto; }
#rail::-webkit-scrollbar { display: none; }
.gicon { width: 48px; height: 48px; border-radius: 50%; background: var(--bg-primary); color: var(--text-normal); display: grid; place-items: center;
  font-size: 15px; font-weight: 600; cursor: pointer; transition: border-radius .15s, background .15s; position: relative; flex: none; user-select: none; }
.gicon:hover, .gicon.on { border-radius: 16px; background: #5865f2; color: #fff; }
.gicon.on::before { content: ""; position: absolute; left: -12px; width: 4px; height: 40px; border-radius: 0 4px 4px 0; background: var(--header-primary); }
.gicon.more { font-size: 12px; background: transparent; border: 1px dashed var(--divider); color: var(--text-muted); cursor: default; }
.gicon.more:hover { border-radius: 50%; background: transparent; color: var(--text-muted); }
.rail-sep { width: 32px; height: 2px; border-radius: 1px; background: var(--bg-mod-active); flex: none; }
#sidebar { width: 240px; flex: none; background: var(--bg-secondary); display: flex; flex-direction: column; min-height: 0; }
#sidebar .ghead { height: 48px; padding: 0 16px; display: flex; align-items: center; font-weight: 600; color: var(--header-primary);
  box-shadow: 0 1px 0 rgba(4,4,5,.2), 0 1.5px 0 rgba(6,6,7,.05), 0 2px 0 rgba(4,4,5,.05); flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#chanlist { overflow-y: auto; padding: 8px 8px 16px 8px; flex: 1; }
.cat { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); padding: 16px 8px 4px 2px; letter-spacing: .02em; }
.chan { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 4px; color: var(--text-muted); cursor: pointer; font-size: 16px; font-weight: 500; margin: 1px 0; }
.chan .hash { font-size: 20px; line-height: 1; width: 20px; text-align: center; opacity: .8; flex: none; }
.chan .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chan:hover { background: var(--bg-mod-hover); color: var(--interactive-hover); }
.chan.on { background: var(--bg-mod-active); color: var(--header-primary); }
.chan.thread { padding-left: 30px; font-size: 14px; }
.chan.locked { opacity: .6; }
#chat { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; position: relative; }
#chathead { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; font-weight: 600; color: var(--header-primary);
  box-shadow: 0 1px 0 rgba(4,4,5,.2), 0 1.5px 0 rgba(6,6,7,.05), 0 2px 0 rgba(4,4,5,.05); z-index: 2; white-space: nowrap; overflow: hidden; }
#chathead .hash { font-size: 24px; color: var(--text-muted); font-weight: 400; }
#chathead .sub { color: var(--text-muted); font-weight: 400; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
#chathead .burger { display: none; background: none; border: 0; color: var(--interactive); font-size: 20px; cursor: pointer; padding: 0 4px 0 0; }
#scroller { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; }
#log { padding: 16px 0 24px; min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
.welcome { padding: 16px 16px 24px; }
.welcome .big { width: 68px; height: 68px; border-radius: 50%; background: var(--bg-mod-active); display: grid; place-items: center; font-size: 40px; color: var(--header-primary); }
.welcome h1 { font-size: 32px; margin: 8px 0; color: var(--header-primary); line-height: 1.25; word-break: break-word; }
.welcome p { color: var(--text-muted); margin: 0; }
#composer { padding: 0 16px 24px; flex: none; position: relative; }
.cbox { background: color-mix(in srgb, var(--bg-tertiary) 55%, var(--bg-primary)); border-radius: 8px; display: flex; align-items: center; min-height: 44px; padding: 0 12px 0 4px; }
.cbox .plus { width: 24px; height: 24px; border-radius: 50%; background: var(--interactive); color: var(--bg-primary); display: grid; place-items: center; margin: 0 12px; font-weight: 700; flex: none; }
.cbox input { flex: 1; background: transparent; border: 0; outline: 0; padding: 11px 0; min-width: 0; }
.cbox input::placeholder { color: var(--text-muted); }
#ac { position: absolute; left: 16px; right: 16px; bottom: calc(100% - 16px); background: var(--bg-secondary); border-radius: 8px; box-shadow: var(--elev); padding: 8px; display: none; }
#ac.show { display: block; }
#ac .acitem { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 4px; cursor: pointer; background: var(--bg-mod-hover); }
#ac .acitem b { color: var(--header-primary); }
#ac .acitem span { color: var(--text-muted); font-size: 14px; }
#ac .achead { font-size: 12px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); padding: 0 8px 6px; }

/* narrow desktop frames, and the mobile frame */
@container (max-width: 760px) { #sidebar { display: none; } }
@container (max-width: 520px) { #rail { display: none; } #chathead .burger { display: inline-block; } }
#frame.mobile #rail, #frame.mobile #sidebar { display: none; }
#frame.mobile #chathead .burger { display: inline-block; }
#frame.drawer #rail, #frame.drawer #sidebar { display: flex; position: absolute; top: 0; bottom: 0; z-index: 20; }
#frame.drawer #rail { left: 0; } #frame.drawer #sidebar { left: 72px; width: min(240px, calc(100% - 72px)); box-shadow: var(--elev); }
#frame.mobile #composer { padding-bottom: 16px; }
#frame.mobile .msg { padding-left: 60px; padding-right: 12px; }
#frame.mobile .msg .avatar { left: 10px; }
#frame.mobile .welcome h1 { font-size: 24px; }

/* ---------------------------------------------------------------- messages */
.msg { position: relative; padding: 2px 48px 2px 72px; margin-top: 17px; min-height: 22px; }
.msg.cont { margin-top: 0; }
.msg:hover { background: var(--bg-message-hover); }
.msg.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: rgba(250,168,26,.2); } to { background: transparent; } }
.msg .avatar { position: absolute; left: 16px; top: 2px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 16px; user-select: none; }
.msg.has-invoker .avatar { top: 24px; }
.msg.cont .avatar { display: none; }
.msg .mhead { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; line-height: 22px; }
.msg .uname { font-weight: 500; color: var(--header-primary); }
.apptag { background: #5865f2; color: #fff; font-size: 10px; font-weight: 600; border-radius: 3px; padding: 0 4px; line-height: 15px; height: 15px; align-self: center; text-transform: uppercase; display: inline-flex; align-items: center; gap: 2px; }
.msg .time { font-size: 12px; color: var(--text-muted); }
.msg .body { color: var(--text-normal); word-wrap: break-word; }
.ilink { display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--header-secondary); margin: 0 0 2px; position: relative; line-height: 18px; white-space: nowrap; overflow: hidden; }
.ilink::before { content: ""; position: absolute; left: -36px; top: 8px; width: 30px; height: 12px; border-left: 2px solid var(--divider); border-top: 2px solid var(--divider); border-top-left-radius: 6px; }
.ilink { overflow: visible; }
.ilink .mini { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9px; color: #fff; }
.ilink .cmd { color: var(--link); }
.ephem { font-size: 12px; color: var(--text-muted); margin-top: 6px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ephem a { color: var(--link); cursor: pointer; }
.ephem a:hover { text-decoration: underline; }
.failed { color: var(--red); font-size: 14px; margin-top: 4px; display: flex; align-items: center; gap: 6px; }
.thinking { color: var(--text-muted); font-style: italic; }
.mtools { position: absolute; right: 16px; top: -16px; display: none; background: var(--bg-primary); border: 1px solid var(--bg-tertiary); border-radius: 6px; z-index: 3; }
.msg:hover .mtools { display: flex; }
.mtools button { background: none; border: 0; padding: 4px 8px; cursor: pointer; color: var(--interactive); font-size: 13px; border-radius: 4px; white-space: nowrap; }
.mtools button:hover { background: var(--bg-mod-hover); color: var(--interactive-hover); }
.msg.selected { box-shadow: inset 2px 0 0 #5865f2; }

/* ---------------------------------------------------------------- markdown */
.md { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
.md p { margin: 0; }
.md h1, .md h2, .md h3 { margin: 8px 0 4px; color: var(--header-primary); font-weight: 700; line-height: 1.375; white-space: pre-wrap; }
.md h1 { font-size: 24px; } .md h2 { font-size: 20px; } .md h3 { font-size: 16px; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md small.sub { display: block; font-size: 13px; line-height: 1.1rem; color: var(--text-muted); }
.md ul, .md ol { margin: 0; padding-left: 20px; white-space: normal; }
.md li { white-space: pre-wrap; }
.md code { font-family: "gg mono", ui-monospace, Consolas, "Andale Mono WT", Menlo, monospace; font-size: 85%; background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 4px; padding: 0 .2em; white-space: pre-wrap; }
.md pre { margin: 4px 0 0; background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 4px; padding: 7px; font: 14px/1.125rem ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-x: auto; }
.md pre code { border: 0; padding: 0; background: none !important; font-size: inherit; }
.container .md code, .container .md pre { background: var(--code-in-container); }
.md blockquote { margin: 0; display: flex; }
.md blockquote::before { content: ""; width: 4px; border-radius: 4px; background: var(--quote-bar); flex: none; }
.md blockquote > div { padding: 0 8px 0 12px; min-width: 0; }
.md a { color: var(--link); text-decoration: none; cursor: pointer; }
.md a:hover { text-decoration: underline; }
.mention { background: var(--mention-bg); color: var(--mention-fg); border-radius: 3px; padding: 0 2px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.mention:hover { background: var(--mention-hover); color: #fff; }
.mention.role { background: color-mix(in srgb, var(--rc) 10%, transparent); color: var(--rc); }
.mention.role:hover { background: color-mix(in srgb, var(--rc) 30%, transparent); color: var(--rc); }
.tstamp { background: var(--bg-mod-hover); border-radius: 3px; padding: 0 2px; }
.cemoji { color: var(--text-muted); font-size: 90%; }
.spoiler { background: var(--spoiler); color: transparent; border-radius: 3px; cursor: pointer; }
.spoiler * { visibility: hidden; }
.spoiler.open { background: var(--bg-mod-hover); color: inherit; }
.spoiler.open * { visibility: visible; }

/* ---------------------------------------------------------------- Components V2 */
.v2 { display: flex; flex-direction: column; gap: 8px; max-width: 600px; margin-top: 2px; }
.v2:empty { display: none; }
#frame.mobile .v2 { max-width: none; }
.container { position: relative; background: var(--container-bg); border: 1px solid var(--container-border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
.container.accent { padding-left: 20px; }
.container.accent::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
.container.spoilered > * { filter: blur(24px); }
.section { display: flex; gap: 16px; align-items: flex-start; }
.section > .stext { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.section > .acc { flex: none; display: flex; max-width: 50%; }
.sep { width: 100%; }
.sep.s2 { padding: 8px 0; }
.sep.div > i { display: block; height: 1px; background: var(--divider); }
.sep:not(.div) > i { display: none; }
.sep.s2:not(.div) { height: 16px; padding: 0; }
.arow { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; min-width: 60px; padding: 2px 16px;
  border: 0; border-radius: 8px; font-size: 14px; font-weight: 500; line-height: 16px; cursor: pointer; color: #fff; transition: background .17s; max-width: 100%; }
.btn > .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn.s1 { background: #5865f2; } .btn.s1:hover { background: #4752c4; }
.btn.s2, .btn.s5 { background: var(--btn-secondary); color: var(--btn-secondary-fg); } .btn.s2:hover, .btn.s5:hover { background: var(--btn-secondary-hover); }
.btn.s3 { background: #248046; } .btn.s3:hover { background: #1a6334; }
.btn.s4 { background: #da373c; } .btn.s4:hover { background: #a12828; }
.btn.s6 { background: linear-gradient(90deg,#8547c6,#b845c1,#ab5d8a); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.busy { cursor: progress; opacity: .7; }
.btn .ext { font-size: 12px; opacity: .9; }
.btn .emo { font-size: 18px; line-height: 1; }
#frame.mobile .btn { min-height: 38px; }
.sel { position: relative; width: 100%; min-height: 40px; background: var(--input-bg); border: 1px solid var(--select-border); border-radius: 8px;
  display: flex; align-items: center; padding: 6px 8px 6px 12px; cursor: pointer; gap: 8px; text-align: left; }
.sel:hover { border-color: var(--bg-tertiary); }
.sel.open { border-radius: 8px 8px 0 0; }
.sel.up.open { border-radius: 0 0 8px 8px; }
.sel .val { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-normal); font-size: 16px; }
.sel .ph { color: var(--text-muted); }

<script>
"use strict";
// ===================================================================== state
const S = {
  world: null,
  viewer: "owner",
  where: null,             // {guild: id | null (the bot's DM), channel: id}
  theme: "dark",
  width: "desktop",
  live: true,
  messages: [],            // the bot's messages in this session
  actions: [],             // what was done, for Re-run
  steps: [],               // [{label, ok, note}]
  selected: null,          // index into messages, shown in the inspector
  modal: null,
  pendingModal: null,
  versions: null,
  status: null,
  busy: false,

  joinFailed: false,
  lastError: null,

let msgSeq = 1;
const SAVE_KEY = "muse-settings-preview";
const THREADS = [10, 11, 12];
const SELECTS = [3, 5, 6, 7, 8];

// ===================================================================== utils

}
const $ = (s) => document.querySelector(s);

}
async function api(path, body) {

}
const PALETTE = ["#5865f2", "#3ba55c", "#faa61a", "#ed4245", "#eb459e", "#1abc9c", "#9b59b6", "#e67e22"];
function colourFor(id) { let n = 0; for (const c of String(id)) n = (n * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[n % PALETTE.length]; }
function avatar(id, name, cls = "avatar") {
  const bot = S.world && id === S.world.bot.id;
  return h("div", {class: cls, style: {background: bot ? "#5865f2" : colourFor(id)}}, (name || "?").slice(0, 1).toUpperCase());
}
function fmtTime(at) {
  return "Today at " + new Date(at * 1000).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
}
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({viewer: S.viewer, where: S.where, theme: S.theme, width: S.width,
      live: S.live, actions: S.actions, fixture: S.world && S.world.fixture}));
  } catch (e) { /* storage blocked: nothing is remembered */ }
}
function load() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { return null; } }

// ===================================================================== world lookups
const W = {
  user(id) { return (S.world.users || []).find((u) => u.id === id); },
  role(id) { return (S.world.roles || []).find((r) => r.id === id); },
  guild(id) { return (S.world.guilds || []).find((g) => g.id === id); },
  channel(id) {
    for (const [gid, cs] of Object.entries(S.world.channels)) {
      const c = cs.find((c) => c.id === id); if (c) return Object.assign({guild_id: gid}, c);
    }
    for (const [gid, ts] of Object.entries(S.world.threads || {})) {
      const t = ts.find((t) => t.id === id); if (t) return Object.assign({guild_id: gid}, t);
    }
    return null;
  },
  viewerUser() { return S.world.viewers[S.viewer]; },
};

// ===================================================================== markdown
// Discord's subset. Blocks: ``` code ```, # ## ### headers, -# subtext,
// - * 1. lists, > and >>> quotes. Inline: \ escapes, `code`, **bold**,
// *italic* _italic_, __underline__, ~~strike~~, ||spoiler||,
// [masked](https://links), <https://url>, bare urls, <@user> <@&role>
// <#channel> </cmd:id> <t:unix:f> <:emoji:id>, @everyone / @here.
const INLINE = [
  ["escape", /^\\([^0-9A-Za-z\s])/],
  ["code", /^(`+)([\s\S]*?[^`])\1(?!`)/],
  ["user", /^<@!?(\d{1,25})>/],
  ["role", /^<@&(\d{1,25})>/],
  ["channel", /^<#(\d{1,25})>/],
  ["cmd", /^<\/([\w\- ]{1,100}):(\d{1,25})>/],
  ["emoji", /^<(a?):(\w{2,32}):(\d{1,25})>/],
  ["time", /^<t:(-?\d{1,17})(?::([tTdDfFR]))?>/],
  ["autolink", /^<(https?:\/\/[^\s>]+)>/],
  ["link", /^\[((?:\\[\s\S]|[^\\\]])+?)\]\(\s*<?(https?:\/\/[^\s)>]+)>?(?:\s+(?:"[^"]*"|'[^']*'))?\s*\)/],
  ["url", /^https?:\/\/[^\s<]+[^<.,:;"')\]\s]/],
  ["strong", /^\*\*([\s\S]+?)\*\*(?!\*)/],
  ["u", /^__([\s\S]+?)__(?!_)/],
  ["em", /^\*(?=\S)((?:\*\*|\\[\s\S]|[^\\*])+?)\*(?!\*)/],
  ["em_", /^_((?:__|\\[\s\S]|[^\\_])+?)_(?![A-Za-z0-9_])/],
  ["s", /^~~([\s\S]+?)~~/],
  ["spoiler", /^\|\|([\s\S]+?)\|\|/],
  ["everyone", /^@(everyone|here)\b/],

function inline(src) {
  const out = [];
  let buf = "";
  const flush = () => { if (buf) { out.push(document.createTextNode(buf)); buf = ""; } };
  let i = 0;
  while (i < src.length) {
    const rest = src.slice(i);
    const prev = i > 0 ? src[i - 1] : "";
    let hit = null;
    for (const [name, re] of INLINE) {
      if (name === "em_" && /[A-Za-z0-9]/.test(prev)) continue;
      const m = re.exec(rest);
      if (m) { hit = [name, m]; break; }
    }
    if (!hit) { buf += src[i]; i += 1; continue; }
    flush();
    out.push(inlineNode(hit[0], hit[1]));
    i += hit[1][0].length;
  }
  flush();
  return out;
}
function mentionPill(text, cls, title, onclick) {
  return h("span", {class: "mention " + (cls || ""), title, onclick}, text);
}
function inlineNode(name, m) {
  switch (name) {
    case "escape": return document.createTextNode(m[1]);
    case "code": return h("code", {}, m[2].replace(/^ (.*) $/, "$1"));
    case "user": {
      const u = W.user(m[1]);
      return mentionPill("@" + (u ? u.name : "unknown-user"), "", m[1], () => toast("User " + (u ? u.name : "unknown") + " (" + m[1] + ")"));
    }
    case "role": {
      const r = W.role(m[1]);
      const el = mentionPill("@" + (r ? r.name : "unknown-role"), "role", m[1]);
      el.style.setProperty("--rc", r && r.color ? r.color : "#949ba4");
      return el;
    }
    case "channel": {
      const c = W.channel(m[1]);
      const icon = c && THREADS.includes(c.type) ? "🧵 " : "# ";
      return mentionPill(icon + (c ? c.name : "unknown"), "", m[1], () => toast(c ? "#" + c.name + " in " + (W.guild(c.guild_id) || {}).name : "Unknown channel " + m[1]));
    }
    case "cmd": return mentionPill("/" + m[1], "", m[2]);
    case "emoji": return h("span", {class: "cemoji", title: "custom emoji " + m[3]}, ":" + m[2] + ":");
    case "time": return h("span", {class: "tstamp", title: new Date(+m[1] * 1000).toString()}, fmtStamp(+m[1], m[2] || "f"));
    case "autolink": return linkNode(m[1], [document.createTextNode(m[1])]);
    case "url": return linkNode(m[0], [document.createTextNode(m[0])]);
    case "link": return linkNode(m[2], inline(m[1]));
    case "strong": return h("strong", {}, inline(m[1]));
    case "u": return h("u", {}, inline(m[1]));
    case "em": case "em_": return h("em", {}, inline(m[1]));
    case "s": return h("s", {}, inline(m[1]));
    case "spoiler": { const el = h("span", {class: "spoiler"}, h("span", {}, inline(m[1]))); el.onclick = () => el.classList.add("open"); return el; }
    case "everyone": return mentionPill("@" + m[1], "", "mass mention");
  }
  return document.createTextNode(m[0]);
}
function fmtStamp(ts, f) {
  const d = new Date(ts * 1000);
  const now = S.world ? S.world.now * 1000 : Date.now();
  switch (f) {
    case "t": return d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
    case "T": return d.toLocaleTimeString();
    case "d": return d.toLocaleDateString();
    case "D": return d.toLocaleDateString([], {dateStyle: "long"});
    case "F": return d.toLocaleString([], {dateStyle: "full", timeStyle: "short"});
    case "R": {
      const s = Math.round((d - now) / 1000), a = Math.abs(s);
      const [n, u] = a < 60 ? [a, "second"] : a < 3600 ? [Math.round(a / 60), "minute"] : a < 86400 ? [Math.round(a / 3600), "hour"] : [Math.round(a / 86400), "day"];

function linkNode(url, kids) {
  return h("a", {title: url, onclick: (e) => { e.preventDefault(); e.stopPropagation(); followLink(url); }}, kids);
}
function followLink(url) {
  const m = /^https:\/\/discord\.com\/channels\/(\d+|@me)\/(\d+)\/(\d+)$/.exec(url);
  if (m) {
    const el = document.querySelector('[data-mid="' + m[3] + '"]');
    if (el) { el.scrollIntoView({block: "center", behavior: "smooth"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); return; }
    const c = W.channel(m[2]);
    toast("Jumps to a message in " + (c ? "#" + c.name : "another channel") + (W.guild(m[1]) ? " (" + W.guild(m[1]).name + ")" : ""));

function markdown(text) {

  let last = 0, m;
  while ((m = fence.exec(text))) {

function blocks(text, root) {
  const lines = text.replace(/^\n/, "").split("\n");
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if ((m = /^>>> ?([\s\S]*)$/.exec(line))) {
      const q = h("div"); blocks([m[1]].concat(lines.slice(i + 1)).join("\n"), q);

    }
    if (/^> /.test(line) || line === ">") {
      const got = [];
      while (i < lines.length && (/^> /.test(lines[i]) || lines[i] === ">")) { got.push(lines[i].replace(/^> ?/, "")); i++; }

    }

      root.append(listNode(items, 0, items[0][1].length)); continue;
    }

function listNode(items, from, indent) {

  let li = null;
  for (let k = from; k < items.length; k++) {
    const it = items[k], ind = it[1].length;
    if (ind < indent) break;
    if (ind > indent && li) {
      li.append(listNode(items, k, ind));
      while (k + 1 < items.length && items[k + 1][1].length > indent) k++;

    }
    li = h("li", {}, inline(it[3]));
    el.append(li);
  }

}

// ===================================================================== validation (cheap client checks)
function issuesOf(c) {
  const bad = [];
  const len = (s) => (typeof s === "string" ? [...s].length : 0);
  if (c.custom_id != null && len(c.custom_id) > 100) bad.push("custom_id is " + len(c.custom_id) + " chars (max 100)");
  if (c.type === 1) {
    const kids = c.components || [];
    if (!kids.length) bad.push("empty action row");
    if (kids.length > 5) bad.push(kids.length + " components in one row (max 5)");
    if (kids.some((k) => SELECTS.includes(k.type)) && kids.length > 1) bad.push("a select must be alone in its row");
  }
  if (c.type === 2) {
    if (!c.label && !c.emoji) bad.push("button with no label or emoji");
    if (len(c.label) > 80) bad.push("button label " + len(c.label) + " chars (max 80)");
    if (c.style === 5 ? !c.url : !c.custom_id && c.style !== 6) bad.push("button without custom_id / url");
  }
  if (SELECTS.includes(c.type)) {
    const mn = c.min_values == null ? 1 : c.min_values, mx = c.max_values == null ? 1 : c.max_values;
    if (len(c.placeholder) > 150) bad.push("placeholder " + len(c.placeholder) + " chars (max 150)");
    if (!(0 <= mn && mn <= mx && mx <= 25)) bad.push("min/max values " + mn + "/" + mx);
    if (c.type === 3) {
      const o = c.options || [];
      if (o.length < 1 || o.length > 25) bad.push(o.length + " options (1-25)");
      if (mx > o.length) bad.push("max_values " + mx + " > " + o.length + " options");
      if (o.filter((x) => x.default).length > mx) bad.push("more defaults than max_values");
      const seen = new Set();
      for (const x of o) {
        if (len(x.label) < 1 || len(x.label) > 100) bad.push("option label " + len(x.label) + " chars (1-100)");
        if (len(x.value) < 1 || len(x.value) > 100) bad.push("option value " + len(x.value) + " chars (1-100)");
        if (len(x.description) > 100) bad.push("option description " + len(x.description) + " chars (max 100)");
        if (seen.has(x.value)) bad.push("duplicate option value " + x.value);
        seen.add(x.value);

    if ((c.default_values || []).length > mx) bad.push("more default_values than max_values");

  S.rerunning = true;
  closePop(false);
  const res = await api("/api/reset", {fixture: S.world ? S.world.fixture : "default"}).catch((e) => ({ok: false, error: String(e)}));
  if (!res.ok) { S.lastError = res; S.rerunning = false; renderAll(); return; }
  S.world = res.world;
  const actions = S.actions;
  resetSession();
  S.busy = true;
  let stopped = null;
  for (let i = 0; i < actions.length; i++) {
    const a = actions[i];
    if (a.kind === "component" && !hasControl(msgByRef(a.ref), a.custom_id)) {
      stopped = `step ${i + 1} (${actionLabel(a)}): that control is gone`;
      S.steps.push({label: actionLabel(a), ok: false, note: "control gone"});
      break;
    }
    const ok = await act(a, {replay: true});
    S.actions.push(a);
    S.steps.push({label: actionLabel(a), ok});
    if (!ok) { stopped = `step ${i + 1} (${actionLabel(a)}) failed`; break; }
  }
  S.busy = false;
  S.rerunning = false;
  save();
  renderAll();
  if (S.pendingModal) { const p = S.pendingModal; S.pendingModal = null; openModal(p.data, p.ref); }
  const sc = $("#scroller"); sc.scrollTop = sc.scrollHeight;
  if (stopped) toast("Re-run stopped at " + stopped, 5000);
  else if (why) toast(why + (actions.length ? ` · re-ran ${actions.length} step${actions.length === 1 ? "" : "s"}` : ""));
  if (S.rerunAgain) { const w = S.rerunAgain; S.rerunAgain = null; rerun(w); }
}
function hasControl(msg, cid) {
  let found = false;
  if (msg) walk(msg.components, (c) => { if (c.custom_id === cid) found = true; });
  return found;
}
function resetSession() {
  S.messages = []; S.actions = []; S.steps = []; S.selected = null; S.modal = null;
  S.joinOverride = null; S.joinFailed = false; S.pendingModal = null; S.lastError = null;
  closePop(false); drawModal();
}
function newSession() { resetSession(); save(); renderAll(); }

// ===================================================================== the client around the messages
function guildChannels(gid) { return S.world.channels[gid] || []; }
function renderRail() {
  const rail = $("#rail"); rail.innerHTML = "";
  rail.append(h("div", {class: "gicon" + (!S.where.guild ? " on" : ""), title: "Direct message with the bot", onclick: () => go({guild: null, channel: S.world.dm_channel})}, "DM"));
  rail.append(h("div", {class: "rail-sep"}));
  const named = S.world.guilds.filter((g) => !g.filler);
  for (const g of named) {
    const initials = g.name.split(/\s+/).map((w) => w[0]).join("").slice(0, 3);
    rail.append(h("div", {class: "gicon" + (S.where.guild === g.id ? " on" : ""), title: g.name, onclick: () => go({guild: g.id, channel: defaultChannel(g.id)})}, initials));
  }
  const fill = S.world.guilds.length - named.length;
  if (fill) rail.append(h("div", {class: "gicon more", title: fill + " filler servers (they show in the server lists)"}, "+" + fill));
}
function defaultChannel(gid) {
  const busiest = {};
  for (const m of S.world.messages) if (m.guild_id === gid) busiest[m.channel_id] = (busiest[m.channel_id] || 0) + 1;
  const best = Object.entries(busiest).sort((a, b) => b[1] - a[1])[0];
  if (best && W.channel(best[0]) && !THREADS.includes(W.channel(best[0]).type)) return best[0];
  const c = guildChannels(gid).find((c) => c.type !== 4);
  return c ? c.id : null;
}
function renderSidebar() {
  const list = $("#chanlist"); list.innerHTML = "";
  const head = $("#ghead");
  if (!S.where.guild) {
    head.textContent = "Direct Messages";
    list.append(h("div", {class: "chan on"}, avatar(S.world.bot.id, S.world.bot.name, "dot big"), h("span", {class: "nm"}, S.world.bot.name)));
    return;
  }
  const g = W.guild(S.where.guild);
  head.textContent = g ? g.name : "";
  const chans = guildChannels(S.where.guild);
  const threads = S.world.threads[S.where.guild] || [];
  const item = (c, extra = "") => {
    const thread = THREADS.includes(c.type);
    list.append(h("div", {class: "chan" + extra + (S.where.channel === c.id ? " on" : "") + (c.readable === false ? " locked" : ""),
      title: c.readable === false ? "The bot can't read this channel" : c.can_send === false ? "The bot can't post here" : null,
      onclick: () => go({guild: S.where.guild, channel: c.id})},
      h("span", {class: "hash"}, thread ? "↳" : c.type === 2 ? "🔊" : "#"), h("span", {class: "nm"}, c.name + (c.readable === false ? " 🔒" : ""))));
    for (const t of threads.filter((t) => t.parent_id === c.id)) item(t, " thread");
  };
  for (const c of chans.filter((c) => c.type !== 4 && !c.parent_id)) item(c);
  for (const cat of chans.filter((c) => c.type === 4)) {
    list.append(h("div", {class: "cat", title: "a category"}, "⌄ " + cat.name));
    for (const c of chans.filter((c) => c.parent_id === cat.id)) item(c);
  }
}
function go(where) {
  $("#frame").classList.remove("drawer");
  if (S.where && S.where.guild === where.guild && S.where.channel === where.channel) return;
  S.where = where;
  newSession();
}
function renderHead() {
  const head = $("#chathead"); head.innerHTML = "";
  head.append(h("button", {class: "burger", title: "Servers and channels", onclick: () => $("#frame").classList.toggle("drawer")}, "☰"));
  if (!S.where.guild) {
    head.append(h("span", {class: "hash"}, "@"), S.world.bot.name, h("span", {class: "apptag"}, "APP"));
    $("#cinput").placeholder = "Message @" + S.world.bot.name;
    return;
  }
  const c = W.channel(S.where.channel) || {name: "?"};
  const thread = THREADS.includes(c.type);
  head.append(h("span", {class: "hash"}, thread ? "↳" : "#"), c.name,
    h("span", {class: "sub"}, (W.guild(S.where.guild) || {}).name + (thread ? " · a thread in #" + (W.channel(c.parent_id) || {}).name : "")));
  $("#cinput").placeholder = "Message " + (thread ? "" : "#") + c.name;
}
function history() {
  if (!S.where.guild) return [];
  return S.world.messages.filter((m) => m.channel_id === S.where.channel).sort((a, b) => a.at - b.at);
}
function renderLog() {
  const log = $("#log"); log.innerHTML = "";
  const c = S.where.guild ? W.channel(S.where.channel) : null;
  log.append(h("div", {class: "welcome"}, h("div", {class: "big"}, S.where.guild ? "#" : "@"),
    h("h1", {}, S.where.guild ? "Welcome to #" + (c ? c.name : "") + "!" : S.world.bot.name),
    h("p", {}, S.where.guild ? "This is the start of the #" + (c ? c.name : "") + " channel." : "This is the beginning of your direct message history with " + S.world.bot.name + ".")));
  let prev = null;
  for (const m of history()) {
    const u = W.user(m.author_id) || {name: "olduser", id: "0"};
    const cont = prev && prev.author_id === m.author_id && m.at - prev.at < 420;
    log.append(h("div", {class: "msg" + (cont ? " cont" : ""), "data-mid": m.id},
      avatar(u.id, u.name),
      cont ? null : h("div", {class: "mhead"}, h("span", {class: "uname", style: {color: colourFor(u.id)}}, u.name),
        u.bot ? h("span", {class: "apptag"}, "APP") : null, h("span", {class: "time"}, fmtTime(m.at))),
      h("div", {class: "body"}, markdown(m.content)),
      h("div", {class: "mtools"}, h("button", {title: "The message command (right-click › Apps)", onclick: () => runWhy(m)}, "Apps › Why no reply?"))));
    prev = m;
  }
  if (!S.where.guild) log.append(botMessage(msgByRef("join"), "join", {at: S.world.dm_history[0].at, failed: S.joinFailed}));
  S.messages.forEach((m, i) => { if (!m.hidden) log.append(botMessage(m, i, {})); });
}
function botMessage(m, ref, o) {
  const bot = S.world.bot;
  const viewer = W.viewerUser();
  const kids = [];
  if (m.invoker) kids.push(h("div", {class: "ilink"}, h("span", {class: "mini", style: {background: colourFor(viewer.id)}}, viewer.name[0]),
    h("span", {}, viewer.name), " used ", h("span", {class: "cmd"}, m.invoker.cmd)));
  kids.push(avatar(bot.id, bot.name));
  kids.push(h("div", {class: "mhead"}, h("span", {class: "uname"}, bot.name), h("span", {class: "apptag"}, "✓ APP"), h("span", {class: "time"}, fmtTime(o.at || m.at))));
  if (m.failedOnly) {
    kids.push(h("div", {class: "failed"}, "⚠ This interaction failed"));
  } else {
    if (m.content) kids.push(h("div", {class: "body"}, markdown(m.content)));
    if (m.thinking) kids.push(h("div", {class: "body thinking"}, bot.name + " is thinking…"));
    kids.push(h("div", {class: "v2"}, renderComponents(m.components, {ref, live: true})));
    if (m.failed || o.failed) kids.push(h("div", {class: "failed"}, "⚠ This interaction failed"));
    if (m.flags & 64) kids.push(h("div", {class: "ephem"}, "👁 Only you can see this • ",
      h("a", {onclick: (e) => { e.stopPropagation(); dismiss(ref); }}, "Dismiss message")));
  }
  const el = h("div", {class: "msg" + (S.selected === ref ? " selected" : "") + (m.invoker ? " has-invoker" : ""), "data-mid": m.id}, kids);
  el.addEventListener("click", () => {
    if (typeof ref !== "number" || S.selected === ref) return;
    S.selected = ref; S.lastError = null;
    document.querySelectorAll(".msg.selected").forEach((x) => x.classList.remove("selected"));
    el.classList.add("selected");
    renderInspector();
  });
  return el;
}
function dismiss(ref) {
  // The message is only hidden (Re-run would bring it back): steps refer
  // to messages by their place in the session.
  const m = S.messages[ref];
  if (m) { m.hidden = true; }
  renderAll();
}

// the message box: "/settings" + Enter, with Discord's command suggestion
function setupComposer() {
  const inp = $("#cinput"), ac = $("#ac");
  const drawAc = () => {
    const v = inp.value.trim();
    if (!v.startsWith("/") || !"/settings".startsWith(v.split(" ")[0])) { ac.classList.remove("show"); return; }
    ac.innerHTML = "";
    ac.append(h("div", {class: "achead"}, "Commands matching " + v),
      h("div", {class: "acitem", onmousedown: (e) => { e.preventDefault(); inp.value = ""; ac.classList.remove("show"); runCommand(); }},
        h("b", {}, "/settings"), h("span", {}, "See or change this bot's settings (owners; server admins can make it quieter)")));
    ac.classList.add("show");
  };
  inp.addEventListener("input", drawAc);
  inp.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const v = inp.value.trim();
    if (v.length > 1 && "/settings".startsWith(v)) { inp.value = ""; ac.classList.remove("show"); runCommand(); }
    else if (v) toast("Only /settings does anything here");
  });
  inp.addEventListener("blur", () => setTimeout(() => ac.classList.remove("show"), 150));
}

// ===================================================================== inspector
function meter(label, n, max) {
  const pct = Math.min(100, Math.round(n / max * 100));
  return h("div", {class: "meter" + (n > max ? " over" : n > max * 0.85 ? " warn" : "")},
    h("div", {class: "lbl"}, h("span", {}, label), h("b", {}, n.toLocaleString() + " / " + max.toLocaleString())),
    h("div", {class: "bar"}, h("i", {style: {width: pct + "%"}})));
}
function copyBtn(obj) {
  return h("button", {class: "tbtn", style: {marginLeft: "8px", padding: "1px 8px"}, onclick: (e) => {
    e.preventDefault();
    navigator.clipboard.writeText(JSON.stringify(obj, null, 2)).then(() => toast("Copied"), () => toast("Copy blocked by the browser"));
  }}, "Copy");
}
const CALLBACKS = {4: "new message", 7: "update message", 9: "modal", 6: "deferred update", 5: "deferred message"};
function renderInspector() {
  const ins = $("#inspector"); ins.innerHTML = "";
  const st = S.status || {};
  if (st.error) ins.append(h("div", {class: "banner-err"}, h("b", {}, "settings_ui.py or muse_settings.py doesn't import"), h("pre", {class: "trace"}, st.error)));

  ins.append(h("h3", {}, "Where"));
  const where = h("select", {"aria-label": "Where", onchange: (e) => { const [g, c] = e.target.value.split("|"); go({guild: g || null, channel: c}); }});
  where.append(h("option", {value: "|" + S.world.dm_channel, selected: !S.where.guild || null}, "DM with " + S.world.bot.name));
  for (const g of S.world.guilds.filter((g) => !g.filler)) {
    const grp = h("optgroup", {label: g.name + " · " + (g.member_count || 0).toLocaleString() + " members"});
    for (const c of guildChannels(g.id).filter((c) => c.type !== 4).slice(0, 10)) {
      grp.append(h("option", {value: g.id + "|" + c.id, selected: S.where.guild === g.id && S.where.channel === c.id || null},
        "#" + c.name + (c.readable === false ? " (bot can't read)" : c.can_send === false ? " (bot can't post)" : "")));
      for (const t of (S.world.threads[g.id] || []).filter((t) => t.parent_id === c.id))
        grp.append(h("option", {value: g.id + "|" + t.id, selected: S.where.channel === t.id || null}, "  ↳ thread " + t.name));
    }
    where.append(grp);
  }
  ins.append(where);
  const v = W.viewerUser();
  ins.append(h("div", {class: "muted", style: {marginTop: "6px"}}, "Viewer ", h("b", {}, v.name), ": " + v.label.toLowerCase() + (S.viewer === "admin" ? " in whichever server you look at" : "") + "."));

  ins.append(h("h3", {}, "Start"));
  const last = history().slice(-1)[0];
  ins.append(h("div", {class: "row2"},
    h("button", {class: "tbtn primary", onclick: runCommand}, "/settings here"),
    S.where.guild ? h("button", {class: "tbtn", disabled: !last || null, onclick: () => last && runWhy(last)}, "Why no reply? (last message)") : null,
    !S.where.guild ? h("button", {class: "tbtn", onclick: () => act({kind: "component", ref: "join", custom_id: joinMessage().components[0].components[0].custom_id, component_type: 2, label: "Configure (join notice)"})}, "Join notice › Configure") : null,
    h("button", {class: "tbtn", onclick: newSession}, "Clear")));
  ins.append(h("div", {class: "muted", style: {marginTop: "6px"}}, "Or type /settings in the message box; hover a message for “Apps › Why no reply?”."));

  // the selected message (or the open modal)
  ins.append(h("h3", {}, S.modal ? "This modal" : "This message"));
  if (S.lastError && !(st.error && S.lastError.trace === st.error)) {
    ins.append(h("div", {class: "banner-err"}, h("b", {}, S.lastError.error || "Error"),
      S.lastError.trace ? h("pre", {class: "trace"}, S.lastError.trace) : null,
      S.lastError.logs && S.lastError.logs.length ? h("pre", {class: "trace"}, S.lastError.logs.join("\n")) : null));
  }
  const sel = typeof S.selected === "number" ? S.messages[S.selected] : null;
  let res = S.lastError && S.lastError.interaction ? S.lastError : null;
  if (S.modal && S.modalResult) {
    res = S.modalResult;
    const issues = [...new Set([...(res.checks || []), ...modalIssues(S.modal.data)])];
    ins.append(h("div", {class: "kv"}, h("span", {}, "Callback"), h("span", {}, "9 · modal"),
      h("span", {}, "Title"), h("span", {}, [...(S.modal.data.title || "")].length + " / 45 chars"),
      h("span", {}, "Components"), h("span", {}, (S.modal.data.components || []).length + " / 5 top-level")));
    ins.append(issues.length ? h("ul", {class: "issues"}, issues.map((x) => h("li", {}, x))) : h("div", {class: "ok", style: {marginTop: "6px"}}, "✓ Passes the suites' checks"));
  } else if (sel && sel.result && sel.result.ok) {
    const r = sel.result;
    res = res || r;
    ins.append(meter("Components", countComponents(sel.components), r.stats.max_components));
    ins.append(meter("Text (texts, labels, options, placeholders)", r.stats.text, r.stats.text_budget));
    const issues = [...new Set([...(r.checks || []), ...clientIssues(sel.components)])];
    ins.append(h("div", {class: "kv", style: {marginTop: "6px"}},
      h("span", {}, "Callback"), h("span", {}, r.response.type + " · " + (CALLBACKS[r.response.type] || "?")),
      h("span", {}, "Flags"), h("span", {}, String(sel.flags) + ((sel.flags & 64) ? " · ephemeral" : "") + ((sel.flags & 32768) ? " · Components V2" : "")),
      h("span", {}, "Answered in"), h("span", {}, r.ms + " ms (Discord allows 3 s)")));
    ins.append(issues.length ? h("ul", {class: "issues"}, issues.map((x) => h("li", {}, x)))
      : h("div", {class: "ok", style: {marginTop: "6px"}}, "✓ Passes the suites' checks (Discord's limits and the copy rules)"));
    if (r.logs && r.logs.length) ins.append(h("details", {open: true}, h("summary", {}, "settings_ui log (" + r.logs.length + ")"), h("pre", {class: "trace"}, r.logs.join("\n"))));
  } else if (!S.lastError) {
    ins.append(h("div", {class: "muted"}, "Run /settings; click a message to see its numbers here."));
  }
  if (res) {
    if (res.response) ins.append(h("details", {}, h("summary", {}, "Response JSON", copyBtn(res.response)), h("pre", {class: "json"}, JSON.stringify(res.response, null, 2))));
    if (res.interaction) ins.append(h("details", {}, h("summary", {}, "Interaction JSON", copyBtn(res.interaction)), h("pre", {class: "json"}, JSON.stringify(res.interaction, null, 2))));
  }

  ins.append(h("h3", {}, "Steps (Re-run replays them)"));
  ins.append(S.steps.length ? h("ol", {class: "steps"}, S.steps.map((s) => h("li", {class: s.ok ? null : "fail"}, s.label + (s.note ? " (" + s.note + ")" : ""))))
    : h("div", {class: "muted"}, "None yet."));

  ins.append(h("h3", {}, "Fake world"));
  const fx = h("select", {"aria-label": "Fixture", onchange: async (e) => {
    const r = await api("/api/reset", {fixture: e.target.value});
    if (r.ok) { S.world = r.world; await rerun("Fixture: " + S.world.fixtures[S.world.fixture]); }
  }});
  for (const [k, label] of Object.entries(S.world.fixtures)) fx.append(h("option", {value: k, selected: S.world.fixture === k || null}, label));
  ins.append(fx);
  ins.append(h("div", {class: "row2", style: {marginTop: "6px"}},
    h("button", {class: "tbtn", onclick: async () => { const r = await api("/api/reset", {fixture: S.world.fixture}); if (r.ok) { S.world = r.world; newSession(); toast("A fresh fake world"); } }}, "Reset world")));
  ins.append(h("div", {class: "muted", style: {marginTop: "6px"}},
    "tests/settingsui/harness.py's fixtures: owner Zach, server admin Riley, member Lee; Muse Lounge (1,240 members: a Staff category, #lobby the bot can't post in, #hidden it can't read, a thread in #muse-chat, 74 filler channels), Study Group (9), Pixel Plaza (48,213) and 60 filler servers; a ledger of refused messages. Writes go through muse_settings to a temp config.yaml + config.discord.yaml. The clock stands still at the fixtures' noon."));
  ins.append(h("div", {class: "muted", style: {marginTop: "6px"}}, "Code under test: " + (st.mut_dir || "?") + " · reloaded " + (st.reloads || 0) + "×"));
}

function renderTop() {
  const seg = $("#seg-viewer"); seg.innerHTML = "";
  const names = {owner: "Owner", admin: "Server admin", member: "Member"};
  for (const [k, v] of Object.entries(S.world.viewers)) {
    seg.append(h("button", {class: S.viewer === k ? "on" : null, title: v.label, onclick: () => { if (S.viewer !== k) { S.viewer = k; newSession(); } }},
      (names[k] || k) + " · " + v.name));
  }
  for (const b of document.querySelectorAll("#seg-width button")) b.classList.toggle("on", b.dataset.v === S.width);
  for (const b of document.querySelectorAll("#seg-theme button")) b.classList.toggle("on", b.dataset.v === S.theme);
  $("#live").checked = S.live;
  document.body.dataset.theme = S.theme;
  $("#frame").classList.toggle("mobile", S.width === "mobile");
}
function renderAll() {
  if (!S.world) return;
  const sc = $("#scroller"), keep = sc.scrollTop;
  renderTop(); renderRail(); renderSidebar(); renderHead(); renderLog(); renderInspector();
  sc.scrollTop = keep;
}

// ===================================================================== live reload
async function poll() {
  try {
    const st = await api("/api/status");
    const key = JSON.stringify(st.files);
    const changed = S.versions !== null && key !== S.versions;
    const errChanged = (S.status || {}).error !== st.error || (S.status || {}).reloads !== st.reloads;
    S.versions = key; S.status = st;
    if (changed && S.live && !S.modal) await rerun("Code changed");
    else if (changed) toast("Code changed: press Re-run" + (S.modal ? " (a modal is open)" : " (Live is off)"));
    else if (errChanged) renderInspector();
  } catch (e) { /* the server is restarting */ }
  setTimeout(poll, 1000);
}

// ===================================================================== boot
async function boot() {
  const saved = load() || {};
  S.viewer = saved.viewer || "owner";
  S.theme = saved.theme || "dark";
  S.width = saved.width || "desktop";
  S.live = saved.live !== false;
  S.world = await api("/api/world");
  if (!S.world.viewers[S.viewer]) S.viewer = "owner";
  S.where = saved.where && (saved.where.guild === null || W.guild(saved.where.guild)) ? saved.where
    : {guild: "60000000000000000001", channel: "70000000000000000003"};
  for (const b of document.querySelectorAll("#seg-width button")) b.onclick = () => { S.width = b.dataset.v; closePop(false); save(); renderAll(); };
  for (const b of document.querySelectorAll("#seg-theme button")) b.onclick = () => { S.theme = b.dataset.v; save(); renderAll(); };
  $("#live").onchange = (e) => { S.live = e.target.checked; save(); };
  $("#btn-rerun").onclick = () => rerun("Re-ran");
  $("#btn-run").onclick = runCommand;
  $("#scroller").addEventListener("scroll", () => closePop(true));
  setupComposer();
  try { const st = await api("/api/status"); S.status = st; S.versions = JSON.stringify(st.files); } catch (e) { /* */ }
  S.actions = saved.actions || [];
  if (saved.fixture && saved.fixture !== S.world.fixture) {
    const r = await api("/api/reset", {fixture: saved.fixture}); if (r.ok) S.world = r.world;
  }
  renderAll();
  if (S.actions.length) await rerun("Restored");
  else if (new URLSearchParams(location.search).has("run")) runCommand();
  poll();
}
boot();
</script>
