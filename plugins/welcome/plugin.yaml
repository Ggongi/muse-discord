name: welcome
description: >-
  Greets new members. When a member joins a server (Discord delivers a
  system join message, type 7), the plugin resolves the target channel
  from its settings and queues a "welcome" item; the worker drafts the
  greeting from the prompt plus the welcome notes. Off by default, and
  not safe in new servers: all_servers keeps it off, so it runs only in
  servers (or channels) that turn it on.
hooks:
  - member_join
# Settings manifest (see muse_settings.load_manifests). Values live at
# plugins.welcome.<key> in the scopes listed.
safe_in_new_servers: false
settings:
  enabled:
    type: on-off
    default: off
    scopes: [everywhere, dms, all_servers, server, channel]
  channel:
    type: channel
    values: [system, "off"]
    allow_names: true
    default: system
    scopes: [everywhere, server]
    description: >-
      Where welcomes are posted: "system" (the server's Discord system
      channel), a channel id, "off" (no welcomes there), or (kept for
      old configs) a channel name resolved inside that server. If the
      resolved channel is one the bot cannot send in, the welcome is
      skipped and logged.
  notes:
    type: text
    maxlen: 500
    default: ""
    scopes: [everywhere, server]
    steers_muse: true
    description: What to mention to newcomers, added to the prompt.
  prompt:
    type: text
    hidden: true
    discord_editable: false
    default: >-
      Welcome {user} to {server}! Write a short, warm welcome. Point
      them to this server's rules and getting-started channels if it
      has them. Do not invite them to talk to the bot.
    scopes: [everywhere, server]
    description: >-
      The whole instruction the worker follows ({user} = a mention of
      the new member, {server} = the server name). Kept for old configs
      (plugins.welcome.prompt); the notes setting is the usual way to
      add to it.
  daily_cap:
    type: number
    min: 0
    max: 10000
    none: true
    default: 10
    discord_editable: false
    scopes: [everywhere, server]
    description: >-
      Max welcomes queued per server per day, so a join wave cannot
      burn unbounded worker tokens. none = no cap.
  max_age_hours:
    type: number
    min: 0
    max: 8760
    none: true
    default: 24
    discord_editable: false
    scopes: [everywhere, server]
    description: >-
      Joins older than this are skipped, so a long monitor outage does
      not welcome week-old members.
