name: media_generation
# Settings id: plugins.media.* (an old config's plugins.media_generation
# block maps onto it).
id: media
description: >-
  Lets allowed users have the worker generate images/video for them.
  The plugin supplies the may_generate gate on queue items: when it
  grants permission, the monitor records a single-use approval and the
  worker may generate (its judgment, from context) and have the core's
  attachment pipeline send the result. Off by default; generation also
  requires the worker's runtime to actually have media tools.
hooks:
  - gate_message
  - generation_sent
safe_in_new_servers: true
settings:
  enabled:
    type: on-off
    default: off
    scopes: [everywhere, dms, all_servers, server, channel]
  who:
    type: people
    values: [owners, everyone]
    default: owners
    risky: true
    legacy: allowed_user_ids
    scopes: [everywhere, server]
    description: >-
      Who may trigger generation: owners, everyone, or a list of user
      ids and "role:<id>" entries (the list replaces the owners; add
      them to it to keep them). Old allowed_user_ids: [] = owners.
  per_day:
    type: number
    min: 0
    max: 1000
    none: true
    default: none
    legacy: daily_cap
    scopes: [everywhere, server]
    description: >-
      Max replies with generated files actually SENT per day (a reply
      carrying two files counts once), counted in the scope where it is
      set. Counted at send time by the generation_sent hook, never at
      queue time. none = no cap.
