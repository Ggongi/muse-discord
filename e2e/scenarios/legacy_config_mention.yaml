# An old-layout config.yaml (bot:, behavior:, safety:,
# owners.user_ids, ...; e2e/config.legacy.yaml) must keep working
# without edits: muse_settings.py maps it onto the new settings, and
# the monitor prints ONE notice line saying so (and how to convert).
# This is the one scenario kept on the old layout on purpose: the
# basic mention path end to end, plus the notice in this scenario's
# monitor.log (the restart onto the legacy config prints it).
# Catches: an old config refused at startup (CONFIG ERROR, the
# scenario flakes on wait_ready), the mapping losing the owner, the
# token file or treat_as_human, or the notice missing.
id: legacy_config_mention
tier: 1
title: "An old-layout config.yaml still runs the bot, with the migration notice"
legacy_config: true
steps:
  - send: { as: a, text: "<@SUT> hello from an old config", label: q1 }
  - wait_for: { sut_messages: 1, timeout: 60 }
expect:
  settle: 10
  checks:
    - sut_reply_count: { eq: 1 }
    - replies_to: q1
    - content_matches: "^ack 1$"
    - ledger_status: { label: q1, status: replied }
    - log_contains: "^Note: config\\.yaml uses the old layout; it still works as is\\. Run `python3 bin/settings\\.py migrate`"
    - log_lacks: "CONFIG ERROR|mixes the old layout"
    # Driver A stays the owner and a human through the mapping.
    - queue_item: { label: q1, from_bot: false, settings: { speaker: owner } }
