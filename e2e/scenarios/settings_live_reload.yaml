# Live reload: a Discord-side change (what /settings writes into
# config.discord.yaml) takes effect on the running monitor, with no
# restart. The `settings` step calls muse_settings.set_value / reset
# on the SUT's config.yaml exactly like settings_ui does
# (servers."<id>".channels."<id>".replies) and waits for the
# monitor's "Settings reloaded" line: its main loop re-stats both
# files every cycle (at most ~2 s apart), so the change lands within
# a tick. A is answered (q1); with this channel set to who.replies
# off, A's mention q2 gets nothing (off applies to owners too: only
# who.allow / who.ignore exempt them); after the reset, q3 is
# answered again, which is also the liveness control. q2's 10 s wait
# covers burst_quiet (1.5 s) plus the fake worker's round trip, so a
# reply the setting failed to stop would land inside it. q2 is
# ledgered skipped, so the sweep never answers it after the reset.
# Catches: the overlay ignored until a restart, a reload that never
# reaches the classification path, a reset that does not restore the
# inherited value, a "reload" that is really a restart, and a
# refused mention left unledgered (the sweep would answer it ~4 min
# later, once replies are back on).
id: settings_live_reload
tier: 1
title: "A /settings change to who.replies applies live, without a restart"
steps:
  - send: { as: a, text: "<@SUT> hello before the change", label: q1 }
  - wait_for: { sut_messages: 1, timeout: 60 }
  - settings: { set: who.replies, value: "off", scope: channel }
  - send: { as: a, text: "<@SUT> are you still there?", label: q2 }
  - wait: 10
  - settings: { reset: who.replies, scope: channel }
  - send: { as: a, text: "<@SUT> and now?", label: q3 }
  - wait_for: { sut_messages: 2, timeout: 60 }
expect:
  settle: 10
  checks:
    - no_sut_reply_to: q2
    - ledger_status: { label: q2, status: skipped }
    - sut_reply_count: { eq: 2 }
    - replies_to_any: [q1, q3]
    - latency: { from: q1, max: 30 }
    - latency: { from: q3, max: 30 }
    - content_matches: "^ack 1$"
    - monitor_restarts: { eq: 0 }
    - log_contains: "(?s)Settings reloaded.*Settings reloaded"
