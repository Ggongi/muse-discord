# Scopes, the quiet direction: the server stays conversational (the
# base config) and this scenario's channel is set to who.replies off
# (servers."<id>".channels."<id>".replies; a channel entry takes the
# short keys only). A's mention in the channel gets nothing (q1); A
# starts a public thread on q1 and mentions the bot inside it (q2),
# which must also get nothing: a thread uses its parent channel's
# settings, and off applies to owners too. Then the channel's setting
# is reset live (`settings` step: an overlay entry `inherit`, the
# same write /settings makes), so the thread falls back to the
# server's conversational and A's next mention there (q3) is answered.
# q3 is the liveness control: it proves the monitor was reading the
# thread all along, so q2's silence came from the setting. Each 10 s
# wait covers burst_quiet (1.5 s) and the fake worker's round trip.
# q1 and q2 are ledgered skipped, so the sweep leaves them alone after
# the reset.
# Catches: a thread resolved to the server scope (q2 answered), the
# channel layer ignored (q1 answered), a reset that does not reach
# threads of that channel, and refused mentions the sweep would answer
# later.
id: scope_channel_off_thread_inherits
tier: 1
title: "A channel set to who.replies off silences its threads too"
config:
  servers:
    "{{GUILD_ID}}":
      channels:
        "{{CHANNEL_ID}}":
          replies: "off"
steps:
  - send: { as: a, text: "<@SUT> hello in the channel", label: q1 }
  - wait: 10
  - thread: { from: q1, name: "side chat", label: t1 }
  - send: { as: a, in: t1, text: "<@SUT> hello in the thread", label: q2 }
  - wait: 10
  - settings: { reset: who.replies, scope: channel }
  - send: { as: a, in: t1, text: "<@SUT> and now?", label: q3 }
  - wait_for: { sut_messages: 1, timeout: 60 }
expect:
  settle: 10
  checks:
    - no_sut_reply_to: q1
    - no_sut_reply_to: q2
    - ledger_status: { label: q1, status: skipped }
    - ledger_status: { label: q2, status: skipped }
    - sut_reply_count: { eq: 1 }
    - replies_to: q3
    - latency: { from: q3, max: 30 }
    - content_matches: "^ack 1$"
