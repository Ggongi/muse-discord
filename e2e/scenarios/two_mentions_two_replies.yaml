# Two different people mention the bot at the same time. Bursts are
# keyed by (channel, author), so these are two items and must get two
# replies, each threaded under its own trigger. Catches: one author's
# message folded into the other's burst, one reply for both, or a
# reply under the wrong person's message. Both latency checks also
# prove each trigger has a reply of its own.
id: two_mentions_two_replies
tier: 1
title: "Two users mentioning the bot at once get one threaded reply each"
steps:
  - send: { as: a, text: "<@SUT> question from A", label: q1 }
  - send: { as: b, text: "<@SUT> question from B", label: q2 }
  - wait_for: { sut_messages: 2, timeout: 60 }
expect:
  settle: 15
  checks:
    - sut_reply_count: { eq: 2 }
    - replies_to_any: [q1, q2]
    - latency: { from: q1, max: 30 }
    - latency: { from: q2, max: 30 }
    - content_matches: "^ack 1$"
    - no_duplicate_replies: true
