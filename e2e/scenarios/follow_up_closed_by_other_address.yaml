# The follow-up window closes when its person addresses someone else
# (monitor.py addresses_someone_else / follow_up_open): a Discord
# reply to another user's message, or an @mention of another user or
# a role. That message is not a follow-up, and the window is gone, so
# the person's next plain message (c2, well inside 120 s) is not one
# either. A's reply c1 goes to B's message c0. q2 (a mention) is the
# liveness control. Catches: a reply to someone else answered as a
# follow-up, or the window surviving it.
id: follow_up_closed_by_other_address
tier: 1
title: "Replying to someone else closes the follow-up window"
steps:
  - send: { as: b, text: "anyone up for lunch at noon?", label: c0 }
  - send: { as: a, text: "<@SUT> what's the capital of Peru?", label: q1 }
  - wait_for: { sut_messages: 1, timeout: 60 }
  - send: { as: a, text: "sure, count me in", reply_to: c0, label: c1 }
  - wait: 3
  - send: { as: a, text: "where should we go?", label: c2 }
  - wait: 20
  - send: { as: a, text: "<@SUT> still there?", label: q2 }
  - wait_for: { sut_messages: 2, timeout: 60 }
expect:
  settle: 10
  checks:
    - no_sut_reply_to: c0
    - no_sut_reply_to: c1
    - no_sut_reply_to: c2
    - sut_reply_count: { eq: 2 }
    - replies_to_any: [q1, q2]
    - latency: { from: q2, max: 30 }
    - log_lacks: "\\(follow-up\\)"
