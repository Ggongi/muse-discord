# Scopes: a channel setting overrides its server, and a thread takes
# its parent channel's settings, not the server's. The test server is
# set to who.replies off and this scenario's channel to
# when-addressed. A channel entry under servers."<id>".channels."<id>"
# takes the short keys only (replies, notes, plugins.<id>.enabled), so
# it is `replies:`, not `who: {replies: ...}` (that is a config error).
# A's mention in the channel is answered (q1). A then starts a public
# thread on q1 and mentions the bot inside it (q2): a brand-new thread
# the monitor has never seen. The gateway delivers the message, the
# monitor looks the thread up once (GET /channels/<id>, which carries
# parent_id), and scope_for resolves it to the parent channel, so q2
# is answered too; it is also the liveness control.
# Catches: the channel layer skipped (q1 unanswered under the server's
# off), and a thread resolved to the server scope instead of its
# parent (q2 unanswered), e.g. when a new thread's parent is unknown
# until a discovery refresh.
id: scope_channel_override
tier: 1
title: "A channel's who.replies overrides the server, and its threads inherit it"
config:
  servers:
    "{{GUILD_ID}}":
      who:
        replies: "off"
      channels:
        "{{CHANNEL_ID}}":
          replies: when-addressed
steps:
  - send: { as: a, text: "<@SUT> hello in the channel", label: q1 }
  - wait_for: { sut_messages: 1, timeout: 60 }
  - thread: { from: q1, name: "side chat", label: t1 }
  - send: { as: a, in: t1, text: "<@SUT> hello in the thread", label: q2 }
  - wait_for: { sut_messages: 2, timeout: 60 }
expect:
  settle: 10
  checks:
    - sut_reply_count: { eq: 2 }
    - replies_to_any: [q1, q2]
    - latency: { from: q1, max: 30 }
    - latency: { from: q2, max: 30 }
    - content_matches: "^ack 1$"
    - no_duplicate_replies: true
