# A worker's deliberate no-reply: the fake worker answers q1 with a
# `silent` outbox item. Nothing may be posted, and the monitor must
# settle it in the ledger as `skipped` (reason "no reply (worker's
# call)", PROTOCOL.md) so the sweep never requeues it. q2 then checks
# the silent item did not block the channel or the outbox.
id: silent_item
tier: 1
title: "A silent outbox item posts nothing and is recorded as settled"
steps:
  - send: { as: a, text: "<@SUT> [[silent]] no answer needed", label: q1 }
  - wait: 20
  - send: { as: a, text: "<@SUT> now please answer", label: q2 }
  - wait_for: { sut_messages: 1, timeout: 60 }
expect:
  settle: 10
  checks:
    - no_sut_reply_to: q1
    - ledger_status: { label: q1, status: skipped }
    - sut_reply_count: { eq: 1 }
    - replies_to: q2
