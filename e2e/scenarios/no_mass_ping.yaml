# The fake worker's reply contains @everyone and a role mention of the
# guild's @everyone role (<@&guild id>). The reply must still go out,
# but ping nobody en masse: sends allow only user mentions
# (allowed_mentions), and sanitize_reply neutralizes @everyone/@here
# with a zero-width space. no_mass_mentions checks mention_everyone,
# mention_roles, and raw @everyone/@here left in the text.
id: no_mass_ping
tier: 1
title: "A reply containing @everyone and a role mention pings no one en masse"
steps:
  - send: { as: a, text: "<@SUT> [[everyone]] make an announcement", label: q1 }
  - wait_for: { sut_messages: 1, timeout: 60 }
expect:
  settle: 15
  checks:
    - sut_reply_count: { eq: 1 }
    - replies_to: q1
    - no_mass_mentions: true
