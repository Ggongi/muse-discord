# who.ignore: B's id listed on the test server. B's mention is not
# answered (and never queued); A, the owner, is answered as usual
# (owners always pass who.allow / who.ignore). q2 is also the
# liveness control. Roles ("role:<id>") are not exercised: the driver
# bots hold no roles in the test server, and Discord leaves the
# @everyone role out of a member's roles.
id: ignore_user
tier: 1
title: "A user listed in who.ignore gets no reply; others still do"
config:
  servers:
    "{{GUILD_ID}}":
      who:
        ignore: ["{{B_ID}}"]
steps:
  - send: { as: b, text: "<@SUT> can you hear me?", label: q1 }
  - wait: 20
  - send: { as: a, text: "<@SUT> and me?", label: q2 }
  - wait_for: { sut_messages: 1, timeout: 60 }
expect:
  settle: 10
  checks:
    - no_sut_reply_to: q1
    - sut_reply_count: { eq: 1 }
    - replies_to: q2
    - latency: { from: q2, max: 30 }
