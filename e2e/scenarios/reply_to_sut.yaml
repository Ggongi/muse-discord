# A Discord reply to one of the bot's messages is direct address even
# without an @mention (who.replies: when-addressed and up). B's reply
# carries no <@SUT>; the runner must send driver replies with
# allowed_mentions.replied_user = false, or Discord lists the SUT in
# the reply's mentions and the mention path answers instead, hiding a
# broken is_reply_to_bot. Catches: replies to the bot being ignored,
# or answered under the wrong message.
id: reply_to_sut
tier: 1
title: "A plain reply to the bot (no @mention) gets an answer"
steps:
  - send: { as: a, text: "<@SUT> first question", label: q1 }
  - wait_for: { sut_messages: 1, timeout: 60 }
  - send: { as: b, text: "and what do you think about that?", reply_to: last_sut, label: q2 }
  - wait_for: { sut_messages: 2, timeout: 60 }
expect:
  settle: 15
  checks:
    - sut_reply_count: { eq: 2 }
    - replies_to_any: [q1, q2]
    # latency also proves some reply is threaded under q2 itself.
    - latency: { from: q2, max: 30 }
    - no_duplicate_replies: true
