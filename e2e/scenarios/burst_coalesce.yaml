# Burst coalescing: a mention plus two quick follow-ups from the same
# author fold into ONE queue item (fake worker answers "ack 3" = three
# fragments) and the reply goes under the LAST fragment. The runner
# sends the three back to back (well inside the 1.5 s human quiet gap
# and the 5 s coalesce_seconds window). Catches: one reply per
# fragment, a partial burst ("ack 1"/"ack 2"), the follow-ups dropped,
# or the reply threaded under the first fragment.
id: burst_coalesce
tier: 1
title: "A mention and two quick follow-ups get one reply under the last fragment"
steps:
  - send: { as: a, text: "<@SUT> quick question", label: q1 }
  - send: { as: a, text: "about the release", label: q2 }
  - send: { as: a, text: "is it out yet?", label: q3 }
  - wait_for: { sut_messages: 1, timeout: 60 }
expect:
  settle: 15
  checks:
    - sut_reply_count: { eq: 1 }
    - replies_to: q3
    - content_matches: "^ack 3$"
    - latency: { from: q3, max: 20 }
    # Every fragment of the burst is settled by the one reply.
    - ledger_status: { label: q1, status: replied }
    - ledger_status: { label: q2, status: replied }
    - ledger_status: { label: q3, status: replied }
