# "Remind me in a minute", end to end against real Discord. The fake
# worker answers q1 with "ack 1" plus a schedule action
# ([[remind:60 ...]]: 60 s after q1, the shortest reminder there is).
# The monitor stores it, and when it is due queues a reminder item;
# the fake worker answers that one "reminder 1", and the monitor sends
# it threaded under q1 (the request), pinging A only. Expect exactly
# two SUT messages, both replies to q1, and never a third (the
# reminder fires once). Catches: a reminder that never fires, fires
# twice, or comes back unthreaded or somewhere else.
id: remind_me
tier: 1
title: "A reminder comes back once, a minute later, under the request"
steps:
  - send: { as: a, text: "<@SUT> [[remind:60 check the oven]] remind me in a minute", label: q1 }
  - wait_for: { sut_messages: 2, timeout: 150 }
expect:
  settle: 8
  checks:
    - sut_reply_count: { eq: 2 }
    - replies_to: q1
    - content_matches: { label: q1, pattern: "^(ack 1|reminder 1)$" }
    - no_duplicate_replies: true
    - ledger_status: { label: q1, status: replied }
    - log_contains: "^Reminders and watches for [0-9]+ \\(item [0-9]+\\): add r"
    - log_contains: "^Queued a reminder for .+ \\(1 item\\(s\\)\\)"
