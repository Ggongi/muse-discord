# never_share backstop: privacy.never_share lists "blue pelican", and
# the fake worker's [[say:...]] directive puts it in the reply to q1.
# The monitor must not post it: it holds the draft in state.json
# `holds`, settles q1 as skipped (so the sweep leaves it), and DMs the
# owners the draft with [Send anyway] / [Discard]. The owner here is
# driver A, a bot, and Discord does not let bots DM bots, so that DM
# fails ("Owner DM to <id> failed") and the hold line says "no owner
# reachable"; the hold itself stays in state.json either way, which is
# what this checks (the log regex accepts both outcomes). q2 is the
# liveness control: a clean reply still goes out.
id: never_share_hold
tier: 1
title: "A reply containing a never_share phrase is held, not posted"
config:
  everywhere:
    privacy:
      never_share: ["blue pelican"]
steps:
  - send: { as: a, text: "<@SUT> [[say:the Blue Pelican says hi]] say hi from the bird", label: q1 }
  - wait: 20
  - send: { as: a, text: "<@SUT> now a normal answer please", label: q2 }
  - wait_for: { sut_messages: 1, timeout: 60 }
expect:
  settle: 10
  checks:
    - no_sut_reply_to: q1
    - held: q1
    - ledger_status: { label: q1, status: skipped }
    - log_contains: "^Held a reply to .+ never_share phrase; (owners DMed|no owner reachable) \\(hold [0-9a-f]+\\)"
    - sut_reply_count: { eq: 1 }
    - replies_to: q2
    - content_matches: "^ack 1$"
