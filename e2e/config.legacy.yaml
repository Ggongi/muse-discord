# The OLD config layout (bot:, behavior:, safety:, owners.user_ids,
# ...), kept on purpose: a scenario with `legacy_config: true` runs
# under this file instead of config.test.yaml, proving an old
# config.yaml still loads unchanged (mapped by muse_settings.py, with
# its one-line notice in monitor.log). Same placeholders and forced
# fields as config.test.yaml (see sut.SUT).
#
#   {{GUILD_ID}}  the test server       {{A_ID}}  driver A (owner)
#   {{B_ID}}      driver B (left out of treat_as_human when a scenario
#                 sets b_is_bot: true)

bot:
  token_file: "{{TOKEN_FILE}}"
  token_env: null
  guild_ids: ["{{GUILD_ID}}"]

owners:
  user_ids: ["{{A_ID}}"]

behavior:
  respond_to: [mention, reply_to_bot]
  active_guild_ids: ["{{GUILD_ID}}"]
  bots: direct
  dm_policy: owner_only
  coalesce_seconds: 5
  max_reply_chars: 1800

safety:
  injection_quarantine: true
  daily_reply_cap: null
  per_user_daily_cap: null

engine:
  # The floor: REST-only (gateway_off) scenarios wait on this cadence.
  rest_poll_seconds: 10
  discovery_refresh_minutes: 30
  sweep:
    every_cycles: 6
    grace_seconds: 240
    max_age_hours: 6
    max_recoveries: 2
  backoff:
    initial_seconds: 60
    max_seconds: 900

presence:
  enabled: false
  status_text: ""
  status_kind: watching

updates:
  check: false

persona:
  file: "{{PERSONA_FILE}}"

plugins:
  welcome:
    enabled: false
  media_generation:
    enabled: false

# Test-only monitor setting: the driver bots count as humans.
testing:
  treat_as_human: ["{{A_ID}}", "{{B_ID}}"]
